
services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: crude-notes-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      PORT: 5000

    expose:
      - "5000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: crude-notes-frontend

    restart: unless-stopped

    expose:
      - "80"

    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://127.0.0.1/health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine

    container_name: crude-notes-caddy

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
